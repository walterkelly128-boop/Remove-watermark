name: Fix login panel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login panel race
        shell: python
        run: |
          from pathlib import Path
          p = Path("tools_app.py")
          s = p.read_text(encoding="utf-8")

          old_click = '''    login_open.click(\n        lambda: gr.update(visible=True),\n        inputs=[],\n        outputs=[auth_panel],\n    )'''
          new_click = '''    login_open.click(\n        lambda: gr.update(visible=True),\n        inputs=[],\n        outputs=[auth_panel],\n        queue=False,\n        js=True,\n    )'''
          if old_click in s and "        queue=False,\n        js=True,\n" not in s[s.index("    login_open.click("):s.index("    member_open.click(")]:
              s = s.replace(old_click, new_click, 1)

          old_restore = '''    except Exception:\n        return (\n            None, None, None,\n            gr.update(visible=False), gr.update(visible=True), gr.update(value="会员中心", visible=False), "",\n            False, "", gr.update(visible=False), False, gr.update(value=""),\n        )'''
          new_restore = '''    except Exception:\n        return (\n            None, None, None,\n            gr.skip(), gr.skip(), gr.skip(), "",\n            False, gr.skip(), gr.skip(), gr.skip(), gr.skip(),\n        )'''
          if old_restore in s:
              s = s.replace(old_restore, new_restore, 1)

          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools_app.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix login register panel interaction"
          git push
