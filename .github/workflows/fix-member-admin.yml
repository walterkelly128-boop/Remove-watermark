name: Fix member panel and admin slash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member panel and admin route
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('tools_app.py')
          s = p.read_text(encoding='utf-8')

          # Always make the member click refresh the account data and return it to member_info.
          s = re.sub(
              r'def toggle_member\(user_id, opened\):\n(?:    .*\n){1,4}',
              '''def toggle_member(user_id, opened):
              if not user_id:
                  return gr.update(visible=False), False, gr.update(value='')
              new_open = not bool(opened)
              return gr.update(visible=new_open), new_open, gr.update(value=_member_markdown(user_id))


''',
              s, count=1)

          # Replace any old two-output member click handler.
          pattern = r'    member_open\.click\(\n(?:        .*\n){1,6}?    \)'
          replacement = '''    member_open.click(
              fn=toggle_member,
              inputs=[user_id, member_opened],
              outputs=[member_panel, member_opened, member_info],
              queue=False,
          )'''
          matches = list(re.finditer(pattern, s))
          if matches:
              # Only replace the first handler whose block starts with member_open.click.
              m = matches[0]
              s = s[:m.start()] + replacement + s[m.end():]

          p.write_text(s, encoding='utf-8')

          p = Path('server.py')
          s = p.read_text(encoding='utf-8')
          if 'from fastapi import FastAPI, Request' not in s:
              s = s.replace('from fastapi import FastAPI', 'from fastapi import FastAPI, Request', 1)
          if 'from fastapi.responses import RedirectResponse' not in s:
              s = s.replace('from fastapi import FastAPI, Request', 'from fastapi import FastAPI, Request\nfrom fastapi.responses import RedirectResponse', 1)
          marker = 'app = mount_gradio_app(app, admin_app.admin_app, path="/admin")\n'
          insert = marker + '\n@app.get("/admin", include_in_schema=False)\ndef admin_redirect(request: Request):\n    return RedirectResponse(url="/admin/", status_code=307)\n'
          if marker in s and 'def admin_redirect' not in s:
              s = s.replace(marker, insert, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate and commit patch
        shell: bash
        run: |
          python -m py_compile tools_app.py server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools_app.py server.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix member center click'
          git push
