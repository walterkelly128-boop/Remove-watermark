name: Fix login state event

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BrowserState restore event
        shell: python
        run: |
          from pathlib import Path

          p = Path("tools_app.py")
          s = p.read_text(encoding="utf-8")

          # A BrowserState change should restore an existing session, but it must
          # not write the same BrowserState value back again. Otherwise the change
          # listener can retrigger itself and interfere with login UI updates.
          old_valid = '''            bool(session["is_admin"]), browser_session, gr.update(visible=False), False,\n            gr.update(value=_member_markdown(uid)),'''
          new_valid = '''            bool(session["is_admin"]), gr.skip(), gr.update(visible=False), False,\n            gr.update(value=_member_markdown(uid)),'''
          if old_valid in s:
              s = s.replace(old_valid, new_valid, 1)

          old_on = '''    gr.on(\n        inputs=[browser_session],\n        outputs=[user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],\n        fn=restore_session,\n    )'''
          new_on = '''    browser_session.change(\n        fn=restore_session,\n        inputs=[browser_session],\n        outputs=[user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],\n        queue=False,\n    )'''
          if old_on in s:
              s = s.replace(old_on, new_on, 1)

          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools_app.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix browser session restore event"
          git push