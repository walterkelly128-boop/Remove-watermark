name: One-shot login fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login and member events
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools_app.py')
          s = p.read_text(encoding='utf-8')

          old = '''    login_btn.click(
        do_login,
        [login_user, login_pass, login_totp],
        [user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],
    )'''
          new = '''    login_btn.click(
        fn=do_login,
        inputs=[login_user, login_pass, login_totp],
        outputs=[user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],
        queue=False,
        show_progress="hidden",
    )'''
          if old not in s:
              raise SystemExit('login event block not found')
          s = s.replace(old, new, 1)

          old_member = '''    member_open.click(
        toggle_member,
        [user_id, member_opened],
        [member_panel, member_opened],
    )'''
          new_member = '''    member_open.click(
        fn=toggle_member,
        inputs=[user_id, member_opened],
        outputs=[member_panel, member_opened, member_info],
        queue=False,
        show_progress="hidden",
    )'''
          if old_member not in s:
              raise SystemExit('member event block not found')
          s = s.replace(old_member, new_member, 1)

          old_toggle = '''def toggle_member(user_id, opened):
    if not user_id:
        return gr.update(visible=False), False
    new_open = not bool(opened)
    return gr.update(visible=new_open), new_open
'''
          new_toggle = '''def toggle_member(user_id, opened):
    if not user_id:
        return gr.update(visible=False), False, gr.update(value="")
    new_open = not bool(opened)
    return (
        gr.update(visible=new_open),
        new_open,
        gr.update(value=_member_markdown(user_id)),
    )
'''
          if old_toggle in s:
              s = s.replace(old_toggle, new_toggle, 1)
          else:
              print('toggle already patched or formatting differs')

          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: python -m py_compile tools_app.py
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-login-now.yml
          git add tools_app.py
          git commit -m 'Fix login and member center events'
          git push
