name: Fix login click handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login click
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools_app.py')
          s = p.read_text(encoding='utf-8')

          old = '''    login_btn.click(\n        do_login,\n        [login_user, login_pass, login_totp],\n        [user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],\n    )'''
          new = '''    login_btn.click(\n        fn=do_login,\n        inputs=[login_user, login_pass, login_totp],\n        outputs=[user_id, session_token, csrf_token, auth_panel, login_open, member_open, auth_message, admin_state, browser_session, member_panel, member_opened, member_info],\n        queue=False,\n        show_progress='hidden',\n    )'''
          if old not in s:
              raise SystemExit('login_btn.click block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools_app.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix login button event handler'
          git push
