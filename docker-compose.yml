services:
  remove-watermark:
    build: .
    container_name: remove-watermark
    ports:
      - "7860:7860"
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
