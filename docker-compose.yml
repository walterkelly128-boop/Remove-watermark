services:
  remove-watermark:
    build: .
    container_name: remove-watermark
    ports:
      - "7860:7860"
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      RC_API_KEY: ${RC_API_KEY}
      RC_API_BASE_URL: ${RC_API_BASE_URL:-https://api.rcouyi.com/v1}
      RC_GEMINI_MODEL: ${RC_GEMINI_MODEL}
      RC_OPENAI_MODEL: ${RC_OPENAI_MODEL}
      RC_API_TIMEOUT: ${RC_API_TIMEOUT:-180}
      FREE_CREDITS: ${FREE_CREDITS:-5}
      GUEST_CREDITS: ${GUEST_CREDITS:-5}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ACCOUNT_DB_PATH: /app/data/accounts.db
      GUEST_IP_SALT: ${GUEST_IP_SALT}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_TOTP_REQUIRED: ${ADMIN_TOTP_REQUIRED:-0}
      RECHARGE_PACKAGES: ${RECHARGE_PACKAGES:-10:5,50:20,100:35}
      RECHARGE_PAYMENT_INSTRUCTIONS: ${RECHARGE_PAYMENT_INSTRUCTIONS:-manual recharge}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
